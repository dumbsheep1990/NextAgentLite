# 地聚物材料问答系统配置文件
development:
  app:
    name: "地聚物材料智能问答系统"
    version: "1.0.0"
    environment: "development"
    debug: true
    host: "0.0.0.0"
    port: 8000
    reload: true

  # 数据库配置
  database:
    postgresql:
      host: "${POSTGRESQL_HOST:-8.153.90.125}"
      port: "${POSTGRESQL_PORT:-5432}"
      database: "${POSTGRESQL_DATABASE:-mat_demo}"
      username: "${POSTGRESQL_USERNAME:-mat_demo}"
      password: "${POSTGRESQL_PASSWORD}"
      pool_size: 20
      max_overflow: 30
      echo: false
    
    elasticsearch:
      hosts:
        - "${ELASTICSEARCH_URL:-http://8.153.90.125:9200}"
      username: "${ELASTICSEARCH_USERNAME:-elastic}"
      password: "${ELASTICSEARCH_PASSWORD}"
      api_key: "${ELASTICSEARCH_API_KEY}"
      index_prefix: "mat_qa"
      timeout: 30
      max_retries: 3
      required_on_startup: true
    
    arangodb:
      url: "${ARANGODB_URL:-http://8.153.90.125:8529}"
      database: "${ARANGODB_DATABASE:-mat_qa_graph}"
      username: "${ARANGODB_USERNAME:-root}"
      password: "${ARANGODB_PASSWORD:-2O5zBrPQrNfVkhn1gXY}"
      graph_name: "knowledge_graph"
      timeout: 30
      verify: false

  # 对象存储配置
  storage:
    minio:
      enabled: true
      endpoint: "localhost:9000"
      access_key: "admin"
      secret_key: "wxn199002"
      secure: false
      region: "us-east-1"
      
      documents_bucket: "mat-qa-documents"
      media_bucket: "mat-qa-media"
      thumbnails_bucket: "mat-qa-thumbnails"
      
      public_endpoint: "http://localhost:9000"
      cdn_endpoint: null
      
      presigned_url_expires: 3600
      auto_create_buckets: true

  # LLM服务配置
  llm:
    # API网关配置（One-API等中转服务）
    api_gateway:
      enabled: true
      base_url: "${ONE_API_BASE_URL}"
      api_key: "${ONE_API_KEY}"
      timeout: 30
      max_retries: 3
      fallback_to_direct: true

    # 按厂商组织的模型配置
    providers:
      # OpenAI模型
      openai:
        # 直连配置
        direct:
          api_key: "${OPENAI_API_KEY}"
          base_url: "https://api.openai.com/v1"
          timeout: 30
        # 是否优先使用网关（one-api中转）
        prefer_gateway: true
        models:
          - id: "gpt-4o-mini"
            name: "GPT-4o Mini"
            model_name: "gpt-4o-mini"
            context_length: 16384
            max_tokens: 2048
            provider: "openai"
          - id: "gpt-4o"
            name: "GPT-4o"
            model_name: "gpt-4o"
            context_length: 32768
            max_tokens: 4096
            provider: "openai"

      # 阿里云模型（通义千问系列）
      alibaba:
        direct:
          api_key: "${QWEN_API_KEY}"
          base_url: "https://dashscope.aliyuncs.com/api/v1"
          timeout: 30
        prefer_gateway: true
        models:
          - id: "qwen-plus"
            name: "通义千问Plus"
            model_name: "qwen-plus-latest"
            context_length: 32768
            max_tokens: 2048
            provider: "alibaba"
          - id: "qwen-turbo"
            name: "通义千问Turbo"
            model_name: "qwen-turbo-latest"
            context_length: 8192
            max_tokens: 1024
            provider: "alibaba"
          - id: "qwen-chat"
            name: "通义千问Chat"
            model_name: "qwen2.5-72b-instruct"
            context_length: 32768
            max_tokens: 2048
            provider: "alibaba"
          - id: "qwen-vl-plus"
            name: "通义千问视觉Plus"
            model_name: "qwen-vl-plus"
            context_length: 4096
            max_tokens: 1024
            provider: "alibaba"
            multimodal: true
          - id: "qwen-vl-max"
            name: "通义千问视觉Max"
            model_name: "qwen-vl-max"
            context_length: 8192
            max_tokens: 2048
            provider: "alibaba"
            multimodal: true

      # Google模型
      google:
        direct:
          api_key: "${GEMINI_API_KEY}"
          base_url: "https://generativelanguage.googleapis.com/v1"
          timeout: 30
        prefer_gateway: true
        models:
          - id: "gemini-pro"
            name: "Gemini Pro"
            model_name: "gemini-1.5-pro"
            context_length: 1048576
            max_tokens: 8192
            provider: "google"
          - id: "gemini-flash"
            name: "Gemini Flash"
            model_name: "gemini-2.5-flash-preview-thinking"
            context_length: 1048576
            max_tokens: 8192
            provider: "google"

      # 自定义模型
      custom:
        direct:
          api_key: "${CUSTOM_API_KEY}"
          base_url: "${CUSTOM_BASE_URL}"
          timeout: 60
        prefer_gateway: false  # 自定义模型通常不通过网关
        models:
          - id: "custom-llm-v1"
            name: "自定义 LLM v1"
            model_name: "custom-llm-v1"
            context_length: 8192
            max_tokens: 4096
            provider: "custom"
          - id: "custom-llm-v2"
            name: "自定义 LLM v2"
            model_name: "custom-llm-v2"
            context_length: 16384
            max_tokens: 8192
            provider: "custom"
    
    # Embedding 模型配置
    embeddings:
      # API网关配置
      api_gateway:
        enabled: true
        base_url: "${ONE_API_BASE_URL}"
        api_key: "${ONE_API_KEY}"
        timeout: 30
        fallback_to_direct: true

      # 按厂商组织的嵌入模型
      providers:
        # 阿里云嵌入模型
        alibaba:
          direct:
            api_key: "${QWEN_API_KEY}"
            base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
            timeout: 30
          prefer_gateway: true
          models:
            - id: "text-embedding-v1"
              name: "通义千问文本嵌入V1"
              model_name: "text-embedding-v1"
              dimension: 1536
              max_tokens: 2048
              provider: "alibaba"
            - id: "text-embedding-v2"
              name: "通义千问文本嵌入V2"
              model_name: "text-embedding-v2"
              dimension: 1536
              max_tokens: 8192
              provider: "alibaba"
            - id: "text-embedding-v3"
              name: "通义千问文本嵌入V3"
              model_name: "text-embedding-v3"
              dimension: 1024
              max_tokens: 8192
              provider: "alibaba"
            - id: "text-embedding-v4"
              name: "通义千问文本嵌入V4"
              model_name: "text-embedding-v4"
              dimension: 1536
              max_tokens: 8192
              provider: "alibaba"

        # OpenAI嵌入模型
        openai:
          direct:
            api_key: "${OPENAI_API_KEY}"
            base_url: "https://api.openai.com/v1"
            timeout: 30
          prefer_gateway: true
          models:
            - id: "text-embedding-3-small"
              name: "OpenAI Text Embedding 3 Small"
              model_name: "text-embedding-3-small"
              dimension: 1536
              max_tokens: 8192
              provider: "openai"
            - id: "text-embedding-ada-002"
              name: "OpenAI Text Embedding Ada 002"
              model_name: "text-embedding-ada-002"
              dimension: 1536
              max_tokens: 8192
              provider: "openai"

        # MatBERT专业模型（不使用网关）
        matbert:
          direct:
            api_key: "${MATBERT_API_KEY}"
            base_url: "${MATBERT_BASE_URL:-http://198.145.104.12:8000}"
            endpoint: "/embed"
            auth_header: "Authorization"
            auth_type: "Bearer"
            timeout: 30
          prefer_gateway: false  # 专业模型直连
          models:
            - id: "matbert-embedding"
              name: "MatBERT材料嵌入模型"
              model_name: "matbert-embedding"
              dimension: 768
              max_tokens: 512
              provider: "matbert"
              domain: "materials_engineering"
              description: "专门针对材料科学和地聚物材料优化的向量嵌入模型"

        # 自定义嵌入模型
        custom:
          direct:
            api_key: "${CUSTOM_EMBEDDING_API_KEY}"
            base_url: "${CUSTOM_EMBEDDING_BASE_URL}"
            timeout: 30
          prefer_gateway: false
          models:
            - id: "custom-embedding-v1"
              name: "自定义嵌入模型V1"
              model_name: "custom-embedding-v1"
              dimension: 512
              max_tokens: 512
              provider: "custom"
            - id: "custom-embedding-v2"
              name: "自定义嵌入模型V2"
              model_name: "custom-embedding-v2"
              dimension: 1024
              max_tokens: 1024
              provider: "custom"
        

  # 检索配置
  retrieval:
    # 默认嵌入提供商和模型
    default_embedding:
      provider: "matbert"  # 优先使用材料专业模型
      model_id: "matbert-embedding"
      fallback:
        provider: "alibaba"
        model_id: "text-embedding-v4"

    # 向量搜索配置
    vector_search:
      default_top_k: 10
      default_threshold: 0.7
      max_results: 50
    
    # 关键词搜索配置
    keyword_search:
      default_limit: 20
      highlight: true
      fuzzy_matching: true
    
    # 混合搜索配置
    hybrid_search:
      vector_weight: 0.7
      keyword_weight: 0.3
      rerank_enabled: true
      cache_enabled: true
      cache_ttl: 3600

  # Agno智能体配置
  agents:
    # 问答智能体
    qa_agent:
      name: "地聚物材料问答专家"
      role: "专业的地聚物材料研究助手"
      model_provider: "alibaba"  # 使用厂商标识
      model_id: "qwen-plus"      # 使用模型ID
      temperature: 0.1
      max_tokens: 2048
      instructions:
        - "你是地聚物材料领域的专家，具有深厚的材料科学知识"
        - "回答问题时要准确、专业，并提供相关的技术细节"
        - "如果涉及实验数据，要说明数据来源和可靠性"
        - "当不确定时，要明确说明不确定性"

    # 文档分析智能体
    doc_analyzer:
      name: "文档内容分析专家"
      role: "分析和理解技术文档内容"
      model_provider: "alibaba"
      model_id: "qwen-turbo"
      temperature: 0.0
      max_tokens: 1024
      instructions:
        - "专注于从技术文档中提取关键信息"
        - "识别重要的技术参数、实验条件和结论"
        - "生成准确的文档摘要和关键词"

    # 多模态分析智能体
    multimodal_agent:
      name: "多模态内容分析专家"
      role: "分析图片、视频等多媒体内容"
      model_provider: "alibaba"
      model_id: "qwen-vl-plus"
      temperature: 0.2
      max_tokens: 1024
      instructions:
        - "准确识别和描述图像中的技术内容"
        - "提取图表、公式和重要的视觉信息"
        - "将视觉内容与文本描述相结合"

  # 智能体团队配置
  agent_teams:
    # 综合问答团队
    qa_team:
      name: "综合问答团队"
      mode: "coordinate"
      coordinator: "qa_agent"
      members: ["qa_agent", "doc_analyzer"]
      success_criteria: "提供准确、全面的问答结果"
      instructions:
        - "qa_agent负责主要的问答处理"
        - "doc_analyzer负责相关文档的深度分析"
        - "coordinator协调两个智能体的工作"

  # 搜索配置
  search:
    vector_search:
      default_top_k: 10
      default_threshold: 0.7
      max_results: 50
    
    keyword_search:
      default_limit: 20
      highlight: true
      fuzzy_matching: true
    
    hybrid_search:
      vector_weight: 0.7
      keyword_weight: 0.3
      rerank_enabled: true
      cache_enabled: true
      cache_ttl: 3600

  # 文件上传配置
  upload:
    max_file_size: 52428800  # 50MB
    allowed_extensions: ["pdf", "docx", "txt", "md", "html"]
    chunk_size: 8192
    local_directory: "uploads"

  # 缓存配置
  cache:
    redis:
      host: "localhost"
      port: 6379
      db: 0
      password: null
      expire_time: 3600

  # 日志配置
  logging:
    level: "INFO"
    format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
    rotation: "1 day"
    retention: "30 days"
    file_path: "logs/mat_qa_{time:YYYY-MM-DD}.log"

  # 监控配置
  monitoring:
    enable_metrics: true
    metrics_port: 9090
    health_check_interval: 30

  # 安全配置
  security:
    secret_key: "${SECRET_KEY}"
    algorithm: "HS256"
    access_token_expire_minutes: 30
    cors_origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3000" 