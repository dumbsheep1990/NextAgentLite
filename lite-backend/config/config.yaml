# 地聚物材料问答系统配置文件
default:
  app:
    name: "地聚物材料智能问答系统"
    version: "1.0.0"
    environment: "development"
    debug: true
    host: "0.0.0.0"
    port: 8000
    reload: true

  # 数据库配置
  database:
    postgresql:
      host: "${POSTGRESQL_HOST:-8.153.90.125}"
      port: "${POSTGRESQL_PORT:-5432}"
      database: "${POSTGRESQL_DATABASE:-mat_demo}"
      username: "${POSTGRESQL_USERNAME:-mat_demo}"
      password: "${POSTGRESQL_PASSWORD}"
      pool_size: 20
      max_overflow: 30
      echo: false
    
    elasticsearch:
      hosts:
        - "${ELASTICSEARCH_URL:-https://8.153.90.125:9200}"
      username: "${ELASTICSEARCH_USERNAME:-elastic}"
      password: "${ELASTICSEARCH_PASSWORD}"
      api_key: "${ELASTICSEARCH_API_KEY}"
      index_prefix: "mat_qa"
      timeout: 30
      max_retries: 3
      required_on_startup: true
    
    arangodb:
      url: "${ARANGODB_URL:-http://8.153.90.125:8529}"
      database: "${ARANGODB_DATABASE:-mat_qa_graph}"
      username: "${ARANGODB_USERNAME:-root}"
      password: "${ARANGODB_PASSWORD:-2O5zBrPQrNfVkhn1gXY}"
      graph_name: "knowledge_graph"
      timeout: 120
      verify: false

  # 对象存储配置
  storage:
    minio:
      enabled: true
      endpoint: "localhost:9000"
      access_key: "admin"
      secret_key: "wxn199002"
      secure: false
      region: "us-east-1"
      
      documents_bucket: "mat-qa-documents"
      media_bucket: "mat-qa-media"
      thumbnails_bucket: "mat-qa-thumbnails"
      knowledge_graph_bucket: "mat-qa-knowledge-graph"
      
      public_endpoint: "http://localhost:9000"
      cdn_endpoint: null
      
      presigned_url_expires: 3600
      auto_create_buckets: true
      skip_bucket_validation: false  # 跳过存储桶验证和创建，直接连接已存在的存储桶

  # LLM服务配置
  llm:
    providers:
      # One-API 服务 (实际可用的模型)
      one_api:
        api_key: "${ONE_API_KEY}"
        base_url: "${ONE_API_BASE_URL}"
        models:
          - id: "kimi-k2-siliconflow"
            name: "kimi-k2-siliconflow"
            model_name: "kimi-k2-siliconflow"
            provider: "moonshot"
            context_length: 128000
            max_tokens: 4096
          - id: "Qwen/Qwen3-235B-A22B-Thinking-2507"
            name: "Qwen/Qwen3-235B-A22B-Thinking-2507"
            model_name: "Qwen/Qwen3-235B-A22B-Thinking-2507"
            provider: "alibaba"
            context_length: 32768
            max_tokens: 2048
          - id: "Qwen/Qwen3-30B-A3B-Instruct-2507"
            name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
            model_name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
            provider: "openai"
            context_length: 16384
            max_tokens: 2048
          - id: "deepseek-ai/DeepSeek-V3"
            name: "deepseek-ai/DeepSeek-V3"
            model_name: "deepseek-ai/DeepSeek-V3"
            provider: "google"
            context_length: 1048576
            max_tokens: 8192
      
      # 阿里巴巴 LLM 服务 (通过OneAPI)
      alibaba:
        api_key: "${ONE_API_KEY}"
        base_url: "${ONE_API_BASE_URL}"
        models:
          - id: "kimi-k2-siliconflow"
            name: "kimi-k2-siliconflow"
            model_name: "kimi-k2-siliconflow"
            provider: "moonshot"
            context_length: 128000
            max_tokens: 8096
          - id: "Qwen/Qwen3-235B-A22B-Thinking-2507"
            name: "Qwen/Qwen3-235B-A22B-Thinking-2507"
            model_name: "Qwen/Qwen3-235B-A22B-Thinking-2507"
            provider: "alibaba"
            context_length: 32768
            max_tokens: 8048

    
    # Embedding 模型配置
    embeddings:
      providers:
        # One-API 向量模型 (实际可用的embedding模型)
        one_api_embedding:
          api_key: "${ONE_API_KEY}"
          base_url: "${ONE_API_BASE_URL}"
          models:
            - id: "text-embedding-v4"
              name: "text-embedding-v4"
              model_name: "text-embedding-v4"
              provider: "one_api_embedding"
              dimension: 1536
              max_tokens: 2048
        
        # 阿里巴巴embedding模型 (通过OneAPI)
        alibaba:
          api_key: "${ONE_API_KEY}"
          base_url: "${ONE_API_BASE_URL}"
          models:
            - id: "text-embedding-v4"
              name: "text-embedding-v4"
              model_name: "text-embedding-v4"
              provider: "alibaba"
              dimension: 1536
              max_tokens: 2048

  # 双向量化系统配置
  vectorization:
    enable_dual_vector: true  # 全局双向量化开关
    system_mode: "auto"  # auto|manual|disabled
    retrieval_mode: "dual"  # dual|general|domain
    default_models:
      general:
        provider: "one_api_embedding"
        model: "text-embedding-v4"
        dimension: 1536
    retrieval_config:
      weights:
        general: 0.4
        domain: 0.6
      top_k: 10
      similarity_threshold: 0.7
      enable_reranking: true
    vector_stores:
      general:
        index_name: "mat_qa_general_vectors"
        auto_create: true
      domain:
        index_name: "mat_qa_domain_vectors"
        auto_create: true
    auto_config:
      file_type_strategy:
        "pdf": "dual"
        "docx": "dual"
        "txt": "dual"  # 改为双向量化
        "md": "dual"
        "html": "dual"
      content_detection:
        enabled: true
        domain_keywords: ["地聚物", "材料工程", "混凝土", "强度", "耐久性", "胶凝材料", "粉煤灰", "矿渣", "硅酸盐", "铝酸盐"]
        keyword_threshold: 3

  # 检索配置
  retrieval:
    default_mode: "auto"
    dynamic_weights:
      base_general: 0.3
      base_domain: 0.5
      base_keyword: 0.2
      domain_boost_factor: 1.5

  # Agno智能体配置
  agents:
    # 问答智能体
    qa_agent:
      name: "地聚物材料问答专家"
      role: "专业的地聚物材料研究助手"
      model_provider: "moonshot"
      model_id: "kimi-k2-siliconflow"
      temperature: 0.1
      max_tokens: 4096
      instructions:
        - "你是地聚物材料领域的专家，具有深厚的材料科学知识"
        - "回答问题时要准确、专业，并提供相关的技术细节"
        - "如果涉及实验数据，要说明数据来源和可靠性"
        - "当不确定时，要明确说明不确定性"

    # 文档分析智能体
    doc_analyzer:
      name: "文档内容分析专家"
      role: "分析和理解技术文档内容"
      model_provider: "one_api"
      model_id: "Qwen/Qwen3-30B-A3B-Thinking-2507"
      temperature: 0.0
      max_tokens: 1024
      instructions:
        - "专注于从技术文档中提取关键信息"
        - "识别重要的技术参数、实验条件和结论"
        - "生成准确的文档摘要和关键词"

    # 多模态分析智能体
    multimodal_agent:
      name: "多模态内容分析专家"
      role: "分析图片、视频等多媒体内容"
      model_provider: "one_api"
      model_id: "Qwen/Qwen3-30B-A3B-Thinking-2507"
      temperature: 0.2
      max_tokens: 1024
      instructions:
        - "准确识别和描述图像中的技术内容"
        - "提取图表、公式和重要的视觉信息"
        - "将视觉内容与文本描述相结合"

    # 材料专家智能体（前端使用的agent名称）
    cailiao_zhuanjia:
      name: "材料专家"
      role: "专业的地聚物材料研究助手"
      model_provider: "moonshot"
      model_id: "kimi-k2-siliconflow"
      temperature: 0.1
      max_tokens: 4096
      instructions:
        - "你是地聚物材料领域的专家，具有深厚的材料科学知识"
        - "回答问题时要准确、专业，并提供相关的技术细节"
        - "如果涉及实验数据，要说明数据来源和可靠性"
        - "当不确定时，要明确说明不确定性"

  # 智能体团队配置
  agent_teams:
    # 综合问答团队
    qa_team:
      name: "综合问答团队"
      mode: "coordinate"
      coordinator: "qa_agent"
      members: ["qa_agent", "doc_analyzer"]
      success_criteria: "提供准确、全面的问答结果"
      instructions:
        - "qa_agent负责主要的问答处理"
        - "doc_analyzer负责相关文档的深度分析"
        - "coordinator协调两个智能体的工作"

  # 搜索配置
  search:
    vector_search:
      default_top_k: 10
      default_threshold: 0.7
      max_results: 50
    
    keyword_search:
      default_limit: 20
      highlight: true
      fuzzy_matching: true
    
    hybrid_search:
      vector_weight: 0.7
      keyword_weight: 0.3
      rerank_enabled: true
      cache_enabled: true
      cache_ttl: 3600

  # 重排序模型配置
  rerank:
    # 阿里云百炼重排序模型
    alibaba_bailian:
      enabled: true
      api_key: "${ALIBABA_BAILIAN_RERANK_API_KEY:-sk-8eccdd68eb4e4e26aeb482473b99dbee}"
      base_url: "${ALIBABA_BAILIAN_RERANK_BASE_URL:-https://dashscope.aliyuncs.com}"
      timeout: 30
      max_retries: 3
      
      # 可用的重排序模型列表
      available_models:
        - id: "gte-rerank-v2"
          name: "GTE Rerank V2"
          model_name: "gte-rerank-v2"
          provider: "alibaba"
          max_documents: 100
          max_query_length: 2048
          default: true  # 默认重排序模型
    
    # 默认重排序配置
    default:
      provider: "alibaba_bailian"
      model_id: "gte-rerank-v2"
      top_k: 10  # 重排序后返回的文档数量
      score_threshold: 0.5  # 分数阈值

  # 文件上传配置
  upload:
    max_file_size: 52428800  # 50MB
    allowed_extensions: ["pdf", "docx", "txt", "md", "html"]
    chunk_size: 8192
    local_directory: "uploads"

  # 缓存配置
  cache:
    redis:
      host: "localhost"
      port: 6379
      db: 0
      password: null
      expire_time: 3600

  # 日志配置
  logging:
    level: "INFO"
    format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
    rotation: "1 day"
    retention: "30 days"
    file_path: "logs/mat_qa_{time:YYYY-MM-DD}.log"

  # 监控配置
  monitoring:
    enable_metrics: true
    metrics_port: 9090
    health_check_interval: 30

  # 安全配置
  security:
  secret_key: "${SECRET_KEY}"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://127.0.0.1:3000" 