# 增强型数据处理Pipeline
# 支持工具调用的完整示例
# 包含数据清洗和敏感信息脱敏

pipeline_name: "enhanced_data_pipeline"
description: "增强型数据处理Pipeline - 包含工具调用示例"
scenario: "general"
is_active: true

# Pre-hooks配置（按执行顺序）
pre_hooks:
  # 1. 输入验证
  - hook_id: "input_validation"
    enabled: true
    class: "InputValidationHook"
    config:
      max_length: 4000
      min_length: 1
      forbidden_patterns:
        - "DROP TABLE"
        - "DELETE FROM"
        - ";--"
        - "<script"
      allow_empty: false

  # 2. 数据清洗（调用外部工具）
  - hook_id: "data_cleaning"
    enabled: true
    class: "DataCleaningPreHook"
    config:
      # 本地清洗选项
      normalize: true
      remove_special_chars: false
      lowercase: false

      # 工具配置 - 调用API工具进行深度清洗
      # 这里配置将调用已在系统中注册的清洗工具
      cleaning_tool: "text_cleaning_api"  # 可改为: null (仅使用本地清洗)

      # 支持MCP工具: "mcp:text_normalizer"

  # 3. 意图分析
  - hook_id: "intent_analysis"
    enabled: true
    class: "IntentAnalysisHook"
    config:
      llm_gateway_url: "http://127.0.0.1:9050"
      model_id: "Qwen/Qwen2.5-7B-Instruct"
      enable_llm_fallback: true
      timeout: 10

  # 4. 检索策略路由（核心）
  - hook_id: "retrieval_strategy_router"
    enabled: true
    class: "RetrievalStrategyRouterHook"
    config:
      pre_retrieve: false
      default_strategy: "hybrid_default"
      routing_rules:
        - name: "事实查询-QA直达"
          conditions:
            intent: "fact"
            complexity: "simple"
          strategy: "qa_direct"

        - name: "综述查询-全量重排"
          conditions:
            intent: ["summary", "compare", "list"]
          strategy: "full_retrieval_with_rerank"

        - name: "实体查询-图谱增强"
          conditions:
            intent: "entity"
          strategy: "graph_enhanced"

        - name: "复杂查询-层次检索"
          conditions:
            complexity: "high"
          strategy: "hierarchical_retrieval"

# Post-hooks配置（按执行顺序）
post_hooks:
  # 1. 敏感信息脱敏（调用外部工具）
  - hook_id: "desensitization"
    enabled: true
    class: "DesensitizationPostHook"
    config:
      # 本地脱敏选项
      mask_email: true
      mask_phone: true
      mask_id: true
      mask_bank_card: true
      mask_ip: true

      # 工具配置 - 调用API工具进行专业脱敏
      # 这里配置将调用已在系统中注册的脱敏工具
      desensitization_tool: "pii_masking_api"  # 可改为: null (仅使用本地脱敏)

      # 支持MCP工具: "mcp:pii_masker"

  # 2. 输出验证
  - hook_id: "output_validation"
    enabled: true
    class: "OutputValidationHook"
    config:
      min_length: 10
      max_length: 5000
      required_patterns: []
      forbidden_patterns: []

# 工具调用说明
#
# 本配置文件展示了如何在Hook中使用工具调用能力
#
# 1. API工具调用
#    - cleaning_tool: "text_cleaning_api"
#    - Hook会自动调用已在系统中注册的API工具
#    - 如果工具调用失败，会降级到本地处理
#
# 2. MCP工具调用
#    - cleaning_tool: "mcp:text_normalizer"
#    - Hook支持调用MCP工具
#    - 格式: "mcp:<tool_name>"
#
# 3. 工具参数
#    - Hook会根据自身参数动态构建工具调用参数
#    - 工具执行结果会被合并回Hook的处理流程
#
# 4. 错误处理
#    - 工具调用失败时的日志会被记录
#    - Hook继续使用本地处理结果
#    - 不会中断整个Pipeline的执行
#
# 5. 审计
#    - 所有工具调用都会被记录到Hook执行日志
#    - 包括工具名称、参数和执行时间
#    - 支持后续的审计和分析
