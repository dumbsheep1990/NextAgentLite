<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>简单iframe测试</title>
    <style>
        body { margin: 0; padding: 20px; }
        iframe { width: 100%; height: 800px; border: 1px solid #ccc; }
        .info { background: #f0f0f0; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <h2>项目内简单iframe测试</h2>
        <p>直接嵌入 http://localhost:9622</p>
        <button onclick="refreshIframe()">刷新iframe</button>
        <button onclick="window.open('http://localhost:9622', '_blank')">新窗口打开</button>
    </div>
    
    <iframe 
        id="test-iframe"
        src="http://localhost:9622"
        title="MatGraph测试">
    </iframe>

    <script>
        function refreshIframe() {
            const iframe = document.getElementById('test-iframe');
            iframe.src = iframe.src.split('?')[0] + '?t=' + Date.now();
            console.log('刷新iframe:', iframe.src);
        }
    </script>
</body>
</html>
